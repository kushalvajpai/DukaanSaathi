<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports – DukaanSaathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-light d-lg-none" id="mobileSidebarToggle"><i class="bi bi-list fs-5"></i></button>
          <h5 class="mb-0 fw-bold" id="topbarTitle">Reports & Exports</h5>
        </div>
        <div class="d-flex gap-2 no-print">
          <button class="btn btn-sm btn-emerald" id="exportCsvBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button>
        </div>
      </header>

      <main class="page-body">
        <div class="ds-card mb-4 no-print">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">Report Type</label>
              <select class="form-select form-select-sm" id="reportType">
                <option value="sales">Sales Report</option>
                <option value="purchases">Purchase Report</option>
                <option value="expenses">Expense Report</option>
                <option value="inventory">Inventory Report (FIFO Valuation)</option>
                <option value="pnl">Profit &amp; Loss Report</option>
                <option value="product_performance">Product Performance Report</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold mb-1">Period</label>
              <select class="form-select form-select-sm" id="repRange">
                <option value="today">Today</option>
                <option value="7d">Last 7 Days</option>
                <option value="month" selected>This Month</option>
                <option value="last_month">Last Month</option>
                <option value="all">All Time</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">Search</label>
              <input type="text" class="form-control form-control-sm" id="repSearch" placeholder="Keyword..." />
            </div>
            <div class="col-md-2">
              <button class="btn btn-sm btn-primary-ds w-100" id="generateRepBtn">Generate</button>
            </div>
          </div>
        </div>

        <!-- Summary Cards -->
        <div id="repSummary" class="row g-3 mb-4"></div>

        <!-- Report Table -->
        <div class="ds-card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead id="repHead"></thead>
              <tbody id="repBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    function buildParams() {
      const params = new URLSearchParams({
        range: document.getElementById('repRange').value
      });
      const s = document.getElementById('repSearch').value.trim();
      if (s) params.set('search', s);
      return params.toString();
    }

    async function loadReport() {
      const type = document.getElementById('reportType').value;
      try {
        const data = await apiFetch(`/reports/${type}?${buildParams()}`);

        const sumEl = document.getElementById('repSummary');
        const entries = Object.entries(data.summary || {}).filter(([, v]) => typeof v !== 'object');
        sumEl.innerHTML = entries.map(([k, v]) => `
          <div class="col-6 col-md-3">
            <div class="kpi-card">
              <div class="kpi-label">${escapeHtml(k.replace(/([A-Z])/g, ' $1'))}</div>
              <div class="kpi-value fs-5">${typeof v === 'number' && !k.toLowerCase().includes('count') && !k.toLowerCase().includes('product') && !k.toLowerCase().includes('transaction') && !k.toLowerCase().includes('margin') ? formatINR(v) : escapeHtml(v)}</div>
            </div>
          </div>
        `).join('');

        const cols = data.columns || [];
        document.getElementById('repHead').innerHTML = `<tr>${cols.map((c) => `<th>${escapeHtml(c.replace(/_/g, ' '))}</th>`).join('')}</tr>`;
        const rows = data.rows || [];
        document.getElementById('repBody').innerHTML = rows.length
          ? rows.map((r) => `<tr>${cols.map((c) => `<td>${escapeHtml(r[c] ?? '-')}</td>`).join('')}</tr>`).join('')
          : `<tr><td colspan="${cols.length || 1}" class="text-center text-muted py-4">No records found for this report.</td></tr>`;
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.getElementById('generateRepBtn').addEventListener('click', loadReport);
    document.getElementById('reportType').addEventListener('change', loadReport);
    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const type = document.getElementById('reportType').value;
      window.location.href = `/api/reports/${type}/csv?${buildParams()}`;
    });

    (async () => {
      const user = await initAppLayout('reports', 'Reports & Exports');
      if (user) await loadReport();
    })();
  </script>
</body>
</html>
