<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Business – DukaanSaathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="text-center mb-4">
        <div class="brand-badge mb-2">
          <span class="brand-icon"><i class="bi bi-shop"></i></span>
          <span>DukaanSaathi</span>
        </div>
        <p class="text-muted small mb-0">Register your store and start tracking real profits</p>
      </div>

      <div id="regError" class="alert alert-danger py-2 small d-none"></div>

      <form id="registerForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-medium small">Store Name</label>
            <input type="text" class="form-control" id="storeName" placeholder="e.g. Gupta Kirana Store" required />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium small">Business Type</label>
            <select class="form-select" id="businessType" required>
              <option value="Kirana / General Store">Kirana / General Store</option>
              <option value="Grocery Shop">Grocery Shop</option>
              <option value="Stationery Store">Stationery Store</option>
              <option value="Clothing Retailer">Clothing Retailer</option>
              <option value="Small Wholesaler">Small Wholesaler</option>
              <option value="Local Retail Business">Local Retail Business</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium small">Owner Name</label>
            <input type="text" class="form-control" id="ownerName" placeholder="Full name" required />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-medium small">Phone Number</label>
            <input type="tel" class="form-control" id="phone" placeholder="10-digit mobile" required />
          </div>
          <div class="col-12">
            <label class="form-label fw-medium small">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="owner@store.com" required />
          </div>
          <div class="col-12">
            <label class="form-label fw-medium small">Password (min 6 characters)</label>
            <input type="password" class="form-control" id="password" minlength="6" required />
          </div>
        </div>
        <button type="submit" id="regBtn" class="btn btn-emerald w-100 py-2 fw-semibold mt-4">
          Create Business Account
        </button>
      </form>

      <div class="text-center mt-4 small">
        Already registered? <a href="/index.html" class="fw-semibold text-decoration-none" style="color: var(--ds-navy);">Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('regError');
      const btn = document.getElementById('regBtn');
      errBox.classList.add('d-none');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await apiFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            storeName: document.getElementById('storeName').value,
            businessType: document.getElementById('businessType').value,
            ownerName: document.getElementById('ownerName').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Business Account';
      }
    });
  </script>
</body>
</html>
