<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products & Inventory – DukaanSaathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-light d-lg-none" id="mobileSidebarToggle"><i class="bi bi-list fs-5"></i></button>
          <h5 class="mb-0 fw-bold" id="topbarTitle">Products & Inventory</h5>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-emerald" id="addProductBtn"><i class="bi bi-plus-lg me-1"></i>Add Product</button>
        </div>
      </header>

      <main class="page-body">
        <!-- Search, Binary Search & Merge Sort Controls -->
        <div class="ds-card mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">Search Name / SKU</label>
              <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search products..." />
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold mb-1">Category</label>
              <select class="form-select form-select-sm" id="categoryFilter">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">Exact SKU Lookup <span class="adsa-pill">C++ Binary Search</span></label>
              <div class="input-group input-group-sm">
                <input type="text" class="form-control" id="binarySkuInput" placeholder="e.g. KIR-001" />
                <button class="btn btn-primary-ds" id="binarySearchBtn">Find</button>
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold mb-1">Sort <span class="adsa-pill">C++ Merge Sort</span></label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="sortBy">
                  <option value="profit">Potential Profit / Unit</option>
                  <option value="price">Selling Price</option>
                  <option value="stock">Stock Quantity</option>
                </select>
                <select class="form-select" id="sortOrder">
                  <option value="desc">High → Low</option>
                  <option value="asc">Low → High</option>
                </select>
                <button class="btn btn-outline-secondary" id="sortBtn">Sort</button>
              </div>
            </div>
          </div>
          <div id="adsaStatus" class="small text-primary mt-2 d-none"></div>
        </div>

        <!-- Products Table -->
        <div class="ds-card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>SKU</th>
                  <th>Product</th>
                  <th>Category</th>
                  <th class="text-end">Cost</th>
                  <th class="text-end">Selling</th>
                  <th class="text-end">Profit/Unit</th>
                  <th class="text-end">Margin</th>
                  <th class="text-center">Stock</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="productsBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Product Modal -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="productForm">
          <div class="modal-header">
            <h5 class="modal-title" id="productModalTitle">Add Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="prodId" />
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Product Name</label>
                <input type="text" class="form-control" id="prodName" required />
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">SKU</label>
                <input type="text" class="form-control" id="prodSku" placeholder="KIR-011" required />
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">Category</label>
                <select class="form-select" id="prodCategory"></select>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">Purchase Price (₹)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="prodPurchasePrice" required />
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">Selling Price (₹)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="prodSellingPrice" required />
              </div>
              <div class="col-md-3" id="initialQtyGroup">
                <label class="form-label small fw-semibold">Initial Quantity</label>
                <input type="number" min="0" class="form-control" id="prodQty" value="0" />
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">Min Stock Level</label>
                <input type="number" min="0" class="form-control" id="prodMinStock" value="5" required />
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Description</label>
                <textarea class="form-control" id="prodDesc" rows="2"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-ds">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Product Details & FIFO Batches Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailTitle">Product Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let productModal, detailModal;
    let categories = [];

    function renderProducts(products) {
      const tbody = document.getElementById('productsBody');
      if (!products.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">No products found.</td></tr>';
        return;
      }

      tbody.innerHTML = products.map((p) => {
        const badgeClass = p.stock_status === 'In Stock' ? 'badge-stock-in' : p.stock_status === 'Low Stock' ? 'badge-stock-low' : 'badge-stock-out';
        return `
          <tr>
            <td><code>${escapeHtml(p.sku)}</code></td>
            <td class="fw-semibold">${escapeHtml(p.name)}</td>
            <td>${escapeHtml(p.category_name || '-')}</td>
            <td class="text-end">${formatINR(p.purchase_price)}</td>
            <td class="text-end">${formatINR(p.selling_price)}</td>
            <td class="text-end ${p.profit_per_unit >= 0 ? 'text-success' : 'text-danger'} fw-semibold">${formatINR(p.profit_per_unit)}</td>
            <td class="text-end">${p.profit_margin}%</td>
            <td class="text-center fw-bold">${p.available_quantity}</td>
            <td><span class="badge ${badgeClass}">${p.stock_status}</span></td>
            <td class="text-end text-nowrap">
              <button class="btn btn-sm btn-light" title="Details & FIFO Batches" onclick="viewDetails(${p.id})"><i class="bi bi-eye"></i></button>
              <button class="btn btn-sm btn-light" title="Edit" onclick='openEdit(${JSON.stringify(p).replace(/'/g, "&#39;")})'><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-light text-danger" title="Delete/Archive" onclick="removeProduct(${p.id}, '${escapeHtml(p.name)}')"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function loadCategories() {
      const data = await apiFetch('/products/categories');
      categories = data.categories || [];
      const filterEl = document.getElementById('categoryFilter');
      const modalEl = document.getElementById('prodCategory');
      filterEl.innerHTML = '<option value="">All Categories</option>' + categories.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      modalEl.innerHTML = '<option value="">Uncategorized</option>' + categories.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    }

    async function loadProducts() {
      document.getElementById('adsaStatus').classList.add('d-none');
      const search = document.getElementById('searchInput').value.trim();
      const cat = document.getElementById('categoryFilter').value;
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (cat) params.set('category_id', cat);

      const data = await apiFetch(`/products?${params.toString()}`);
      renderProducts(data.products);
    }

    async function runBinarySearch() {
      const sku = document.getElementById('binarySkuInput').value.trim();
      if (!sku) return loadProducts();
      try {
        const data = await apiFetch(`/products/search?key=sku&value=${encodeURIComponent(sku)}`);
        const statusEl = document.getElementById('adsaStatus');
        statusEl.textContent = `${data.algorithm} — ${data.found ? `Match found in ${data.comparisons} comparison(s)` : 'Product not found'}`;
        statusEl.classList.remove('d-none');
        renderProducts(data.product ? [data.product] : []);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function runMergeSort() {
      const by = document.getElementById('sortBy').value;
      const order = document.getElementById('sortOrder').value;
      try {
        const data = await apiFetch(`/products/sort?by=${by}&order=${order}`);
        const statusEl = document.getElementById('adsaStatus');
        statusEl.textContent = `Sorted using ${data.algorithm} by ${by} (${order})`;
        statusEl.classList.remove('d-none');
        renderProducts(data.products);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    window.viewDetails = async function (id) {
      try {
        const data = await apiFetch(`/products/${id}`);
        const p = data.product;
        document.getElementById('detailTitle').textContent = `${p.name} (${p.sku})`;
        const batchRows = data.batches.length
          ? data.batches.map((b) => `<tr><td>#${b.id}</td><td>${formatDate(b.received_at)}</td><td class="text-end">${b.remaining_quantity} / ${b.initial_quantity}</td><td class="text-end">${formatINR(b.unit_cost)}</td></tr>`).join('')
          : '<tr><td colspan="4" class="text-muted text-center">No active FIFO batches</td></tr>';

        document.getElementById('detailBody').innerHTML = `
          <p class="small text-muted mb-2">${escapeHtml(p.description || 'No description')}</p>
          <div class="row g-2 small mb-3">
            <div class="col-6"><strong>Purchase Price:</strong> ${formatINR(p.purchase_price)}</div>
            <div class="col-6"><strong>Selling Price:</strong> ${formatINR(p.selling_price)}</div>
            <div class="col-6"><strong>Available Stock:</strong> ${p.available_quantity}</div>
            <div class="col-6"><strong>Min Stock Alert:</strong> ${p.min_stock_level}</div>
          </div>
          <h6 class="fw-bold small text-uppercase text-muted">Active FIFO Inventory Cost Layers</h6>
          <table class="table table-sm small mb-0">
            <thead><tr><th>Batch</th><th>Received</th><th class="text-end">Remaining</th><th class="text-end">Unit Cost</th></tr></thead>
            <tbody>${batchRows}</tbody>
          </table>
        `;
        detailModal.show();
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    window.openEdit = function (p) {
      document.getElementById('productModalTitle').textContent = 'Edit Product';
      document.getElementById('prodId').value = p.id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodSku').value = p.sku;
      document.getElementById('prodCategory').value = p.category_id || '';
      document.getElementById('prodPurchasePrice').value = p.purchase_price;
      document.getElementById('prodSellingPrice').value = p.selling_price;
      document.getElementById('prodMinStock').value = p.min_stock_level;
      document.getElementById('prodDesc').value = p.description || '';
      document.getElementById('initialQtyGroup').classList.add('d-none');
      productModal.show();
    };

    window.removeProduct = async function (id, name) {
      const ok = await confirmAction('Delete / Archive Product', `Are you sure you want to delete "${name}"? Products with past transactions will be archived safely.`);
      if (!ok) return;
      try {
        const res = await apiFetch(`/products/${id}`, { method: 'DELETE' });
        showToast(res.message, res.archived ? 'warning' : 'success');
        await loadProducts();
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    document.getElementById('addProductBtn').addEventListener('click', () => {
      document.getElementById('productForm').reset();
      document.getElementById('prodId').value = '';
      document.getElementById('productModalTitle').textContent = 'Add Product';
      document.getElementById('initialQtyGroup').classList.remove('d-none');
      productModal.show();
    });

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('prodId').value;
      const body = {
        name: document.getElementById('prodName').value,
        sku: document.getElementById('prodSku').value,
        category_id: document.getElementById('prodCategory').value || null,
        purchase_price: Number(document.getElementById('prodPurchasePrice').value),
        selling_price: Number(document.getElementById('prodSellingPrice').value),
        min_stock_level: Number(document.getElementById('prodMinStock').value),
        description: document.getElementById('prodDesc').value
      };
      if (!id) {
        body.available_quantity = Number(document.getElementById('prodQty').value || 0);
      }

      try {
        await apiFetch(id ? `/products/${id}` : '/products', {
          method: id ? 'PUT' : 'POST',
          body: JSON.stringify(body)
        });
        productModal.hide();
        showToast(id ? 'Product updated' : 'Product added');
        await loadProducts();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('searchInput').addEventListener('input', loadProducts);
    document.getElementById('categoryFilter').addEventListener('change', loadProducts);
    document.getElementById('binarySearchBtn').addEventListener('click', runBinarySearch);
    document.getElementById('sortBtn').addEventListener('click', runMergeSort);

    (async () => {
      productModal = new bootstrap.Modal(document.getElementById('productModal'));
      detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
      const user = await initAppLayout('products', 'Products & Inventory');
      if (user) {
        await loadCategories();
        await loadProducts();
      }
    })();
  </script>
</body>
</html>
