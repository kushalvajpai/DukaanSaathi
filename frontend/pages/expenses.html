<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses – DukaanSaathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-light d-lg-none" id="mobileSidebarToggle"><i class="bi bi-list fs-5"></i></button>
          <h5 class="mb-0 fw-bold" id="topbarTitle">Operating Expenses</h5>
        </div>
        <button class="btn btn-sm btn-emerald" id="addExpenseBtn"><i class="bi bi-plus-lg me-1"></i>Add Expense</button>
      </header>

      <main class="page-body">
        <div class="ds-card mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">Search Description</label>
              <input type="text" class="form-control form-control-sm" id="expSearch" placeholder="Search..." />
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">Category</label>
              <select class="form-select form-select-sm" id="expCatFilter">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold mb-1">From</label>
              <input type="date" class="form-control form-control-sm" id="expStart" />
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold mb-1">To</label>
              <input type="date" class="form-control form-control-sm" id="expEnd" />
            </div>
            <div class="col-md-2">
              <button class="btn btn-sm btn-primary-ds w-100" id="expFilterBtn">Filter</button>
            </div>
          </div>
        </div>

        <div class="ds-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">Expense Ledger</h6>
            <span class="fw-bold text-danger" id="totalExpBadge">Total: ₹0.00</span>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Category</th>
                  <th>Description</th>
                  <th class="text-end">Amount</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="expensesBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Expense Modal -->
  <div class="modal fade" id="expenseModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="expenseForm">
          <div class="modal-header">
            <h5 class="modal-title" id="expenseModalTitle">Add Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="expId" />
            <div class="mb-3">
              <label class="form-label small fw-semibold">Category</label>
              <select class="form-select" id="expCategory" required></select>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Amount (₹)</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="expAmount" required />
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Expense Date</label>
                <input type="date" class="form-control" id="expDate" required />
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small fw-semibold">Description</label>
              <input type="text" class="form-control" id="expDesc" placeholder="e.g. Monthly shop electricity bill" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-ds">Save Expense</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let expenseModal;
    const EXP_CATS = ['Electricity', 'Shop Rent', 'Transportation', 'Employee Salary', 'Packaging', 'Maintenance', 'Internet', 'Marketing', 'Other'];

    function populateCats() {
      document.getElementById('expCatFilter').innerHTML = '<option value="">All Categories</option>' +
        EXP_CATS.map((c) => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('expCategory').innerHTML = EXP_CATS.map((c) => `<option value="${c}">${c}</option>`).join('');
    }

    async function loadExpenses() {
      const params = new URLSearchParams();
      const s = document.getElementById('expSearch').value.trim();
      const c = document.getElementById('expCatFilter').value;
      const sd = document.getElementById('expStart').value;
      const ed = document.getElementById('expEnd').value;
      if (s) params.set('search', s);
      if (c) params.set('category', c);
      if (sd) params.set('start_date', sd);
      if (ed) params.set('end_date', ed);

      const data = await apiFetch(`/expenses?${params.toString()}`);
      const list = data.expenses || [];
      const total = list.reduce((acc, e) => acc + Number(e.amount), 0);
      document.getElementById('totalExpBadge').textContent = `Total: ${formatINR(total)}`;

      const tbody = document.getElementById('expensesBody');
      tbody.innerHTML = list.length
        ? list.map((e) => `
          <tr>
            <td class="small">${formatDate(e.expense_date)}</td>
            <td><span class="badge bg-light text-dark border">${escapeHtml(e.category)}</span></td>
            <td>${escapeHtml(e.description)}</td>
            <td class="text-end fw-semibold text-danger">${formatINR(e.amount)}</td>
            <td class="text-end text-nowrap">
              <button class="btn btn-sm btn-light" onclick='openEditExp(${JSON.stringify(e).replace(/'/g, "&#39;")})'><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-light text-danger" onclick="deleteExp(${e.id})"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `).join('')
        : '<tr><td colspan="5" class="text-center text-muted py-4">No expenses recorded.</td></tr>';
    }

    window.openEditExp = function (e) {
      document.getElementById('expenseModalTitle').textContent = 'Edit Expense';
      document.getElementById('expId').value = e.id;
      document.getElementById('expCategory').value = e.category;
      document.getElementById('expAmount').value = e.amount;
      document.getElementById('expDate').value = String(e.expense_date).slice(0, 10);
      document.getElementById('expDesc').value = e.description;
      expenseModal.show();
    };

    window.deleteExp = async function (id) {
      const ok = await confirmAction('Delete Expense', 'Are you sure you want to permanently delete this expense record?');
      if (!ok) return;
      try {
        await apiFetch(`/expenses/${id}`, { method: 'DELETE' });
        showToast('Expense deleted');
        await loadExpenses();
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    document.getElementById('addExpenseBtn').addEventListener('click', () => {
      document.getElementById('expenseForm').reset();
      document.getElementById('expId').value = '';
      document.getElementById('expDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('expenseModalTitle').textContent = 'Add Expense';
      expenseModal.show();
    });

    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('expId').value;
      const body = {
        category: document.getElementById('expCategory').value,
        amount: Number(document.getElementById('expAmount').value),
        expense_date: document.getElementById('expDate').value,
        description: document.getElementById('expDesc').value
      };
      try {
        await apiFetch(id ? `/expenses/${id}` : '/expenses', {
          method: id ? 'PUT' : 'POST',
          body: JSON.stringify(body)
        });
        expenseModal.hide();
        showToast(id ? 'Expense updated' : 'Expense added');
        await loadExpenses();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('expFilterBtn').addEventListener('click', loadExpenses);
    document.getElementById('expSearch').addEventListener('input', loadExpenses);

    (async () => {
      expenseModal = new bootstrap.Modal(document.getElementById('expenseModal'));
      populateCats();
      const user = await initAppLayout('expenses', 'Operating Expenses');
      if (user) await loadExpenses();
    })();
  </script>
</body>
</html>
