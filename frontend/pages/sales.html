<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales – DukaanSaathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-light d-lg-none" id="mobileSidebarToggle"><i class="bi bi-list fs-5"></i></button>
          <h5 class="mb-0 fw-bold" id="topbarTitle">Sales & Billing</h5>
        </div>
        <span class="small text-muted d-none d-sm-inline">FIFO COGS calculated automatically by C++ engine</span>
      </header>

      <main class="page-body">
        <div class="row g-4">
          <!-- New Sale Billing Card -->
          <div class="col-lg-5">
            <div class="ds-card">
              <h6 class="fw-bold mb-3"><i class="bi bi-cart-plus me-1 text-success"></i>Create New Bill</h6>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Search / Select Product</label>
                <div class="input-group input-group-sm">
                  <select class="form-select" id="productSelect"></select>
                  <input type="number" min="1" value="1" class="form-control" id="addQtyInput" style="max-width: 85px;" />
                  <button type="button" class="btn btn-emerald" id="addToBillBtn">Add</button>
                </div>
              </div>

              <div class="table-responsive mb-3">
                <table class="table table-sm align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Item</th>
                      <th class="text-center">Qty</th>
                      <th class="text-end">Price</th>
                      <th class="text-end">Total</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="billItemsBody">
                    <tr><td colspan="5" class="text-center text-muted py-3 small">No items added to bill</td></tr>
                  </tbody>
                </table>
              </div>

              <div class="border-top pt-3 mb-3">
                <div class="d-flex justify-content-between small text-muted mb-1">
                  <span>Subtotal</span>
                  <span id="billSubtotal">₹0.00</span>
                </div>
                <div class="d-flex justify-content-between fw-bold fs-5 text-dark">
                  <span>Total Bill</span>
                  <span id="billTotal">₹0.00</span>
                </div>
              </div>

              <form id="saleForm">
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label class="form-label small fw-semibold">Payment Method</label>
                    <select class="form-select form-select-sm" id="paymentMethod">
                      <option value="Cash">Cash</option>
                      <option value="UPI">UPI</option>
                      <option value="Card">Card</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label small fw-semibold">Customer (Optional)</label>
                    <input type="text" class="form-control form-control-sm" id="customerName" placeholder="Walk-in Customer" />
                  </div>
                </div>
                <button type="submit" id="saveSaleBtn" class="btn btn-primary-ds w-100 fw-semibold">
                  <i class="bi bi-check2-circle me-1"></i>Complete Sale & Generate Invoice
                </button>
              </form>
            </div>
          </div>

          <!-- Sales History Card -->
          <div class="col-lg-7">
            <div class="ds-card">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div>
                  <h6 class="fw-bold mb-0">Sales History</h6>
                  <span class="adsa-pill mt-1" id="salesAlgoBadge">C++ Quick Sort</span>
                </div>
                <div class="d-flex gap-2">
                  <input type="text" class="form-control form-control-sm" id="saleSearch" placeholder="Invoice / Customer..." style="width: 150px;" />
                  <select class="form-select form-select-sm" id="saleSortBy" style="width: 120px;">
                    <option value="date">Sort: Date</option>
                    <option value="revenue">Sort: Revenue</option>
                  </select>
                  <select class="form-select form-select-sm" id="saleSortOrder" style="width: 110px;">
                    <option value="desc">Desc</option>
                    <option value="asc">Asc</option>
                  </select>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Invoice</th>
                      <th>Date</th>
                      <th>Method</th>
                      <th class="text-end">Revenue</th>
                      <th class="text-end">COGS</th>
                      <th class="text-end">Gross Profit</th>
                      <th class="text-end">Invoice</th>
                    </tr>
                  </thead>
                  <tbody id="salesHistoryBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Invoice Modal -->
  <div class="modal fade" id="invoiceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header no-print">
          <h5 class="modal-title">Tax / Retail Invoice</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="invoiceBody"></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary-ds" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print Invoice</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let allProducts = [];
    let billItems = [];
    let invoiceModal;
    let isSubmitting = false;

    async function loadAvailableProducts() {
      const data = await apiFetch('/products');
      allProducts = (data.products || []).filter((p) => p.available_quantity > 0);
      const sel = document.getElementById('productSelect');
      sel.innerHTML = allProducts.length
        ? allProducts.map((p) => `<option value="${p.id}">${escapeHtml(p.name)} (${p.sku}) — ₹${p.selling_price} [Stock: ${p.available_quantity}]</option>`).join('')
        : '<option value="">No products in stock</option>';
    }

    function renderBill() {
      const tbody = document.getElementById('billItemsBody');
      if (!billItems.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3 small">No items added to bill</td></tr>';
        document.getElementById('billSubtotal').textContent = '₹0.00';
        document.getElementById('billTotal').textContent = '₹0.00';
        return;
      }

      let total = 0;
      tbody.innerHTML = billItems.map((item, idx) => {
        const line = item.selling_price * item.quantity;
        total += line;
        return `
          <tr>
            <td class="small fw-semibold">${escapeHtml(item.name)}</td>
            <td class="text-center">
              <input type="number" min="1" max="${item.max_stock}" value="${item.quantity}"
                class="form-control form-control-sm text-center mx-auto" style="width: 65px;"
                onchange="updateBillQty(${idx}, this.value)" />
            </td>
            <td class="text-end small">${formatINR(item.selling_price)}</td>
            <td class="text-end small fw-semibold">${formatINR(line)}</td>
            <td class="text-end"><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="removeBillItem(${idx})"><i class="bi bi-x-lg"></i></button></td>
          </tr>
        `;
      }).join('');

      document.getElementById('billSubtotal').textContent = formatINR(total);
      document.getElementById('billTotal').textContent = formatINR(total);
    }

    window.updateBillQty = function (idx, val) {
      const qty = parseInt(val, 10);
      if (!qty || qty <= 0) return showToast('Quantity must be at least 1', 'warning');
      if (qty > billItems[idx].max_stock) {
        showToast(`Only ${billItems[idx].max_stock} units available in stock`, 'warning');
        billItems[idx].quantity = billItems[idx].max_stock;
      } else {
        billItems[idx].quantity = qty;
      }
      renderBill();
    };

    window.removeBillItem = function (idx) {
      billItems.splice(idx, 1);
      renderBill();
    };

    document.getElementById('addToBillBtn').addEventListener('click', () => {
      const pid = Number(document.getElementById('productSelect').value);
      const qty = parseInt(document.getElementById('addQtyInput').value, 10);
      if (!pid) return showToast('Please select a product', 'warning');
      if (!qty || qty <= 0) return showToast('Enter a valid quantity', 'warning');

      const prod = allProducts.find((p) => p.id === pid);
      if (!prod) return;

      const existing = billItems.find((i) => i.product_id === pid);
      const newQty = (existing ? existing.quantity : 0) + qty;
      if (newQty > prod.available_quantity) {
        return showToast(`Insufficient stock! Available: ${prod.available_quantity}`, 'error');
      }

      if (existing) {
        existing.quantity = newQty;
      } else {
        billItems.push({
          product_id: prod.id,
          name: prod.name,
          selling_price: prod.selling_price,
          quantity: qty,
          max_stock: prod.available_quantity
        });
      }
      document.getElementById('addQtyInput').value = 1;
      renderBill();
    });

    document.getElementById('saleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSubmitting) return;
      if (!billItems.length) return showToast('Add at least one product to the bill', 'warning');

      isSubmitting = true;
      const btn = document.getElementById('saveSaleBtn');
      btn.disabled = true;
      btn.textContent = 'Processing FIFO Sale...';

      try {
        const res = await apiFetch('/sales', {
          method: 'POST',
          body: JSON.stringify({
            items: billItems.map((i) => ({ product_id: i.product_id, quantity: i.quantity })),
            payment_method: document.getElementById('paymentMethod').value,
            customer_name: document.getElementById('customerName').value
          })
        });
        showToast(`Invoice ${res.sale.invoiceNumber} saved! Gross Profit: ${formatINR(res.sale.grossProfit)}`);
        billItems = [];
        document.getElementById('customerName').value = '';
        renderBill();
        await Promise.all([loadAvailableProducts(), loadSalesHistory()]);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        isSubmitting = false;
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Complete Sale & Generate Invoice';
      }
    });

    async function loadSalesHistory() {
      const search = document.getElementById('saleSearch').value.trim();
      const sortBy = document.getElementById('saleSortBy').value;
      const order = document.getElementById('saleSortOrder').value;

      const params = new URLSearchParams({ sortBy, order });
      if (search) params.set('search', search);

      const data = await apiFetch(`/sales?${params.toString()}`);
      document.getElementById('salesAlgoBadge').textContent = data.algorithm || 'C++ Quick Sort';

      const tbody = document.getElementById('salesHistoryBody');
      tbody.innerHTML = data.sales.length
        ? data.sales.map((s) => `
          <tr>
            <td class="fw-semibold"><code>${escapeHtml(s.invoice_number)}</code></td>
            <td class="small">${formatDate(s.sale_date)}</td>
            <td><span class="badge bg-light text-dark border">${escapeHtml(s.payment_method)}</span></td>
            <td class="text-end fw-semibold">${formatINR(s.total_amount)}</td>
            <td class="text-end text-muted">${formatINR(s.total_cogs)}</td>
            <td class="text-end text-success fw-semibold">${formatINR(s.gross_profit)}</td>
            <td class="text-end"><button class="btn btn-sm btn-light" onclick="viewInvoice(${s.id})"><i class="bi bi-receipt"></i></button></td>
          </tr>
        `).join('')
        : '<tr><td colspan="7" class="text-center text-muted py-4">No sales recorded yet.</td></tr>';
    }

    window.viewInvoice = async function (id) {
      try {
        const data = await apiFetch(`/sales/${id}`);
        const s = data.sale;
        document.getElementById('invoiceBody').innerHTML = `
          <div class="text-center border-bottom pb-3 mb-3">
            <h5 class="fw-bold mb-0">${escapeHtml(s.store_name)}</h5>
            <div class="small text-muted">${escapeHtml(s.business_type)}</div>
            <div class="small mt-1">Invoice: <strong>${escapeHtml(s.invoice_number)}</strong> | Date: ${formatDate(s.sale_date)}</div>
          </div>
          <div class="small mb-2">
            <strong>Customer:</strong> ${escapeHtml(s.customer_name || 'Walk-in Customer')} &nbsp;|&nbsp;
            <strong>Payment:</strong> ${escapeHtml(s.payment_method)}
          </div>
          <table class="table table-sm small">
            <thead><tr><th>Item</th><th class="text-center">Qty</th><th class="text-end">Rate</th><th class="text-end">Total</th></tr></thead>
            <tbody>
              ${data.items.map((it) => `<tr><td>${escapeHtml(it.product_name)}</td><td class="text-center">${it.quantity}</td><td class="text-end">${formatINR(it.selling_price)}</td><td class="text-end">${formatINR(it.line_total)}</td></tr>`).join('')}
            </tbody>
          </table>
          <div class="border-top pt-2 d-flex justify-content-between fw-bold">
            <span>Grand Total</span>
            <span>${formatINR(s.total_amount)}</span>
          </div>
        `;
        invoiceModal.show();
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    document.getElementById('saleSearch').addEventListener('input', loadSalesHistory);
    document.getElementById('saleSortBy').addEventListener('change', loadSalesHistory);
    document.getElementById('saleSortOrder').addEventListener('change', loadSalesHistory);

    (async () => {
      invoiceModal = new bootstrap.Modal(document.getElementById('invoiceModal'));
      const user = await initAppLayout('sales', 'Sales & Billing');
      if (user) {
        await Promise.all([loadAvailableProducts(), loadSalesHistory()]);
      }
    })();
  </script>
</body>
</html>
