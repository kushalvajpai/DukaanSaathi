<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – DukaanSaathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-badge mb-2">
          <span class="brand-icon"><i class="bi bi-shop"></i></span>
          <span>DukaanSaathi</span>
        </div>
        <p class="text-muted small mb-0">Smart Business Management System for Indian Retailers</p>
      </div>

      <div id="loginError" class="alert alert-danger py-2 small d-none"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label fw-medium small">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label fw-medium small">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required />
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary-ds w-100 py-2 fw-semibold">
          Sign In
        </button>
      </form>

      <div class="mt-3 p-3 rounded-3 bg-light border">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="small fw-semibold text-dark"><i class="bi bi-stars text-success me-1"></i>Demo Store</span>
          <button type="button" id="fillDemoBtn" class="btn btn-sm btn-emerald py-0 px-2">Use Demo</button>
        </div>
        <div class="small text-muted">
          <strong>Sharma General Store</strong><br />
          Email: <code>sharma@dukaansaathi.in</code> | Pass: <code>Demo@1234</code>
        </div>
      </div>

      <div class="text-center mt-4 small">
        New shopkeeper? <a href="/pages/register.html" class="fw-semibold text-decoration-none" style="color: var(--ds-navy);">Register your business</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // Redirect if already authenticated
    apiFetch('/auth/me').then(() => {
      window.location.href = '/pages/dashboard.html';
    }).catch(() => {});

    document.getElementById('fillDemoBtn').addEventListener('click', () => {
      document.getElementById('email').value = 'sharma@dukaansaathi.in';
      document.getElementById('password').value = 'Demo@1234';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errBox.classList.add('d-none');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
